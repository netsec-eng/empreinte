name: Tests et publication

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Calculer l'empreinte
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/Empreinte.exe -Algorithm SHA256).Hash.ToLower()
          "$hash *Empreinte.exe" | Set-Content -NoNewline target/release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Empreinte
          path: |
            target/release/Empreinte.exe
            target/release/SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Empreinte
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Empreinte.exe
            SHA256SUMS
