[package]
name = "empreinte"
version = "1.0.0"
edition = "2021"
description = "Vérifie l'intégrité et l'origine des fichiers téléchargés sous Windows."
license = "MIT"
build = "build.rs"

[[bin]]
name = "Empreinte"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
rfd = "0.15"
arboard = { version = "3", default-features = false }
notify = "8"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "2", features = ["json"] }
pgp = "0.15"
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
] }

[dev-dependencies]
rand = "0.8"
egui_kittest = "0.31"
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
